spring:
  application:
    name: request-service
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
      retry:
        max-attempts: 5
        max-interval: 2000

grpc:
  client:
    collector:
      address: 'discovery:///collector'
      negotiationType: PLAINTEXT
    analyzer:
      address: 'discovery:///analyzer'
      negotiationType: PLAINTEXT

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/