spring:
  application:
    name: event-service
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
      retry:
        max-attempts: 15
        max-interval: 7500

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka