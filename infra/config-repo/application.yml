spring:
  main:
    banner-mode: OFF
    log-startup-info: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 2000

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}

logging:
  level:
    ru.practicum: WARN
    org:
      springframework: ERROR

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: NEVER
      probes:
        enabled: true
