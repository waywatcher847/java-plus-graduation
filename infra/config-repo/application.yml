spring:
  main:
    banner-mode: OFF
    log-startup-info: false

  endpoint:
    health:
      show-details: NEVER
      probes:
        enabled: true

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}

logging:
  level:
    ru.practicum: WARN
    org:
      springframework: ERROR

