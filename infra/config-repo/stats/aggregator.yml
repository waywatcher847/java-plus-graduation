kafka:
  bootstrap-servers: localhost:9092
  producer:
    bootstrap-servers: ${kafka.bootstrap-servers}
    key-serializer: org.apache.kafka.common.serialization.LongSerializer
    value-serializer: ru.practicum.ewm.stats.avro.AvroEncoder
    client-id: aggregator-producer
  consumer:
    aggregator:
      bootstrap-servers: ${kafka.bootstrap-servers}
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: ru.practicum.ewm.stats.avro.ActionDecoder
      enable-auto-commit: false
      client-id: aggregator-consumer
      group-id: aggregator.group
      auto-offset-reset: latest
      max-poll-records: 5
      max-poll-interval: 60000
  topics:
    user-actions: stats.user-actions.v1
    event-similarity: stats.events-similarity.v1

server:
  port: 0