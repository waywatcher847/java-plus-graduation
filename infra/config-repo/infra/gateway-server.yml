server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests/**,/users/*/events/*/requests/**,/internal/requests/**

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**,/admin/categories/**,/admin/compilations/**,/admin/locations/**,/events/**,/categories/**,/compilations/**,/locations/**,/users/*/events/**,/internal/events/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**,/users/*/subscriptions/**,/internal/users/**
        
        - id: socials-service
          uri: lb://socials-service
          predicates:
            - Path=/admin/comments/**,/users/*/comments/**,/users/*/events/*/comments/**,/users/*/events/*/like,/users/*/events/*/dislike,/users/*/events/*/rating,/events/*/comments/**,/internal/socials/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true