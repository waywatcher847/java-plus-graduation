server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: categories
          uri: lb://main-service
          predicates:
            - Path=/categories,/categories/**
        - id: events
          uri: lb://main-service
          predicates:
            - Path=/events,/events/**
        - id: locations
          uri: lb://main-service
          predicates:
            - Path=/locations,/locations/**
        - id: compilations
          uri: lb://main-service
          predicates:
            - Path=/compilations,/compilations/**
        - id: admin
          uri: lb://main-service
          predicates:
            - Path=/admin/**
        - id: users
          uri: lb://main-service
          predicates:
            - Path=/users/**
