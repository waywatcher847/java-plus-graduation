spring:
  application:
    name: main-service
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
      retry:
        max-attempts: 5
        max-interval: 1000

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/