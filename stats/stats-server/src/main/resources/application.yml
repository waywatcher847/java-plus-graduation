spring:
  application:
    name: stats-server
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
      retry:
        use-random-policy: true
        max-interval: 7600
        max-attempts: 15

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka